<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnight Chat Party — STICKERS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --ink:#111;
    --paper:#fff;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    height:100dvh;
    overflow:hidden;
    background:var(--paper);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
    display:grid;
    grid-template-rows:auto 1fr auto;
    -webkit-user-select:none; user-select:none;
  }

  /* ---- header ---- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:2.6vh 4vw 2vh;
    border-bottom:3px solid var(--ink);
  }
  header h1{
    font-size:5.6vh;
    font-weight:900;
    letter-spacing:.02em;
    line-height:1;
  }
  header .band{
    font-size:2vh;
    font-weight:800;
    letter-spacing:.28em;
  }

  /* ---- stickers ---- */
  main{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:5vw;
    padding:2vh 4vw;
    min-height:0;
  }
  figure{
    text-align:center;
    min-width:0;
    margin:0;
  }
  main figure img{
    display:block;
    max-width:38vw;
    max-height:42vh;
    width:auto; height:auto;
    border:3px solid var(--ink);
  }
  main figcaption{
    margin-top:1.6vh;
    font-size:1.9vh;
    font-weight:800;
    letter-spacing:.34em;
    text-indent:.34em; /* letter-spacing の右余白ぶん補正 */
  }

  /* ---- price ---- */
  footer{
    display:grid;
    grid-template-columns:1fr 1.5fr;
    border-top:3px solid var(--ink);
  }
  .price{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:3vh 2vw;
  }
  .price .group{
    display:flex;
    align-items:baseline;
    gap:1.2vw;
    white-space:nowrap;
  }
  .price .label{
    font-size:2.4vh;
    font-weight:700;
  }
  .price .yen{
    font-size:6.4vh;
    font-weight:900;
    line-height:1;
    letter-spacing:.01em;
  }
  .price.follow{
    background:var(--ink);
    color:var(--paper);
    align-items:center;
    gap:2.5vw;
  }
  .deal{
    display:flex;
    align-items:baseline;
    gap:1vw;
  }
  .deal .label,
  .deal .count,
  .deal .yen{
    white-space:nowrap;
  }
  .deal .count{
    font-size:3vh;
    font-weight:800;
  }
  .qrs{
    display:flex;
    gap:1.5vw;
  }
  .qrs{ cursor:pointer; }
  .qr{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.8vh;
  }
  .qrzoom{
    align-self:center;
    width:4.4vh; height:4.4vh;
    border-radius:50%;
    background:var(--paper);
    color:var(--ink);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex:none;
    margin-left:.5vw;
  }
  .qrzoom svg{ width:2.5vh; height:2.5vh; display:block; }
  .qr img{
    display:block;
    height:12vh; width:auto; /* アスペクト維持（歪むと読めなくなる） */
    background:var(--paper);
    padding:.7vh; /* QRの静穏域（白フチ） */
  }
  .qr figcaption svg{
    width:2.4vh; height:2.4vh;
    display:block;
  }

  /* ---- QR拡大オーバーレイ ---- */
  #qrOverlay{
    position:fixed; inset:0;
    background:var(--paper);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3.5vh;
    z-index:100;
    cursor:pointer;
  }
  #qrOverlay.show{ display:flex; }
  .ov-grid{
    display:flex;
    gap:7vw;
    align-items:flex-start;
  }
  .ov-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2.6vh;
  }
  .ov-item svg{ width:4.6vh; height:4.6vh; display:block; color:var(--ink); }
  .ov-item img{
    max-width:37vw; max-height:56vh;
    width:auto; height:auto;
  }
  #qrOverlay .ov-hint{
    font-size:1.9vh;
    font-weight:800;
    color:#999;
    letter-spacing:.3em;
    text-indent:.3em;
  }

  /* ---- portrait ---- */
  @media (orientation:portrait){
    header h1{ font-size:4.4vh; }
    header .band{ font-size:1.6vh; letter-spacing:.2em; }
    main{
      gap:6vw;
    }
    main figure img{
      max-width:40vw;
      max-height:26vh;
    }
    main figcaption{ margin-top:1vh; }
    footer{ grid-template-columns:1fr; }
    .price{ padding:2vh 2vw; }
    .price .yen{ font-size:5.4vh; }
    .price.follow{
      flex-direction:column;
      gap:1.5vh;
    }
    .qr img{ height:12vh; width:auto; }
  }
</style>
</head>
<body>

<header>
  <h1>STICKERS</h1>
  <div class="band">Midnight Chat Party</div>
</header>

<main>
  <figure>
    <img src="sticker-white.png" alt="ステッカー（白）">
    <figcaption>WHITE</figcaption>
  </figure>
  <figure>
    <img src="sticker-gray.png" alt="ステッカー（グレー）">
    <figcaption>GRAY</figcaption>
  </figure>
</main>

<footer>
  <div class="price">
    <span class="group">
      <span class="label">1枚</span>
      <span class="yen">¥150</span>
    </span>
  </div>
  <div class="price follow">
    <div class="deal">
      <span class="label">SNSフォローで</span>
      <span class="count">2枚</span>
      <span class="yen">¥200</span>
    </div>
    <!-- QR: flyer/ に qr-instagram.jpg / qr-x.jpg を置くと表示される（無ければ自動非表示） -->
    <div class="qrs" onclick="showQRs()">
      <figure class="qr">
        <img src="qr-instagram.jpg" alt="Instagram QR" onerror="this.parentElement.style.display='none'">
        <figcaption>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="Instagram">
            <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
            <circle cx="12" cy="12" r="4.4"/>
            <circle cx="17.4" cy="6.6" r="1.3" fill="currentColor" stroke="none"/>
          </svg>
        </figcaption>
      </figure>
      <figure class="qr">
        <img src="qr-x.jpg" alt="X QR" onerror="this.parentElement.style.display='none'">
        <figcaption>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-label="X">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </figcaption>
      </figure>
      <button class="qrzoom" type="button" aria-label="QRを拡大表示">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <line x1="15.3" y1="15.3" x2="21" y2="21"/>
          <line x1="7.7" y1="10.5" x2="13.3" y2="10.5"/>
          <line x1="10.5" y1="7.7" x2="10.5" y2="13.3"/>
        </svg>
      </button>
    </div>
  </div>
</footer>

<!-- QR拡大表示（2つ並び・どこをタップしても閉じる） -->
<div id="qrOverlay" onclick="hideQR()">
  <div class="ov-grid">
    <div class="ov-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="Instagram">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5"/>
        <circle cx="12" cy="12" r="4.4"/>
        <circle cx="17.4" cy="6.6" r="1.3" fill="currentColor" stroke="none"/>
      </svg>
      <img src="qr-instagram.jpg" alt="Instagram QR（拡大）">
    </div>
    <div class="ov-item">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-label="X">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      <img src="qr-x.jpg" alt="X QR（拡大）">
    </div>
  </div>
  <div class="ov-hint">タップで閉じる</div>
</div>

<script>
function showQRs(){
  document.getElementById('qrOverlay').classList.add('show');
}
function hideQR(){
  document.getElementById('qrOverlay').classList.remove('show');
}
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
}
</script>

</body>
</html>
